name: Xattr backup error propagation qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-report-xattr-read-errors-20261025
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Check exact mapper format
        run: cargo fmt --all -- --check
      - name: Run failure-injection regression tests
        run: cargo test -p rustic_core xattr_error_tests --lib -- --nocapture
      - name: Check rustic_core complete library type safety
        run: cargo check -p rustic_core
